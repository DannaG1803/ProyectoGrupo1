<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Inicio{% endblock %} | Nacimientos Bucaramanga</title>

    <!-- Bootstrap 5 e íconos desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilos.css') }}" rel="stylesheet">
    {% block estilos %}{% endblock %}
</head>
<body>
<div class="d-flex min-vh-100">

    {% include "partials/sidebar.html" %}

    <div class="contenido-principal d-flex flex-column flex-grow-1">

        <!-- Barra superior: solo se ve en celular/tablet para abrir el menú lateral -->
        <header class="barra-movil d-lg-none bg-marca text-white d-flex align-items-center px-3 py-2 sticky-top shadow-sm">
            <button class="btn btn-link text-white p-0 me-3 fs-3" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral"
                    aria-label="Abrir menú">
                <i class="bi bi-list"></i>
            </button>
            <span class="fw-semibold"><i class="bi bi-heart-pulse me-1"></i> Nacimientos Bucaramanga</span>
        </header>

        <main class="flex-grow-1 py-4">
            <div class="container-fluid px-3 px-lg-4">
                {% block contenido %}{% endblock %}
            </div>
        </main>

        {% include "partials/footer.html" %}
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js se carga antes de main.js para que tome la configuración común -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
